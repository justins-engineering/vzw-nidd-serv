[package]
name = "loft"
version = "0.1.0"
authors = ["justin <code@jes.contact>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.6.0", features = ["router", "fullstack"] }
dioxus-free-icons = { version = "0.9", features = [
  "font-awesome-brands",
  "lucide",
] }
serde_json = "1.0"

web-sys = { version = "0.3.77", features = ["Headers", "HtmlDocument", "Window"], optional = true }
web-time = { version = "1.1.0", optional = true }
js-sys = { version = "0.3.77", optional = true }
wasm-theme = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm"))'.dependencies]
reqwest = { version = "0.12", features = ["json"], optional = true }
ory-kratos-client-wasm = { version = "0.1.5", default-features = false, features = ["reqwest"], optional = true }

[target.'cfg(target_arch = "wasm")'.dependencies]
ory-kratos-client-wasm = { version = "0.1", optional = true }


[features]
default = ["web"]
web = ["dioxus/web", "dep:web-time", "dep:js-sys", "dep:web-sys", "dep:wasm-theme"]
server = ["dioxus/server", "dep:ory-kratos-client-wasm", "dep:reqwest"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]


[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
