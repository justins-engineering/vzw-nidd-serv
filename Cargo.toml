[package]
name = "loft"
version = "0.1.0"
authors = ["justin <code@jes.contact>"]
edition = "2021"

# [package.metadata.release]
# release = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { version = "0.6.0", features = ["router"] }
# dioxus-free-icons = { version = "0.9", features = [
#   "font-awesome-brands",
#   "lucide",
# ], optional = true }
# # serde_json = "1.0"
# ory-kratos-client-wasm = { version = "0.1", optional = true }

# # Web client dependencies
# js-sys = { version = "0.3.77", optional = true }
# wasm-theme = { version = "0.1", optional = true }
# web-sys = { version = "0.3.77", features = [
#   "Headers",
#   "HtmlDocument",
#   "Window",
# ], optional = true }
# web-time = { version = "1.1.0", optional = true }

# Dependencies for `api` feature
reqwest = { version = "0.12", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_urlencoded = { version = "0.7", optional = true }
web-sys = { version = "0.3", features = ["Location", "Window"], optional = true}
console_error_panic_hook = { version = "0.1.7" }
futures = "0.3"
http = "1.3"
serde_json = "1"
worker = { version = "0.6", features = ['http'] }
worker-macros = { version = "0.6", features = ['http'] }

# Server dependencies
server_fn = { version = "0.8", features = ["browser"], optional = true }
server_fn_macro_default = { version = "0.8", optional = true }

[features]
default = ["web", "api"]
# web = ["dioxus/web", "dep:js-sys", "dep:ory-kratos-client-wasm", "dep:wasm-theme", "dep:web-sys", "dep:web-time"]
web = ["dioxus/web"]
api = ["dep:reqwest", "dep:serde", "dep:serde_urlencoded", "dep:web-sys"]
server-fn = ["dep:server_fn", "dep:server_fn_macro_default"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
